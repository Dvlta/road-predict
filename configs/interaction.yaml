# Interaction model (design doc §19): target, neighbors and map chunks as tokens of one
# Transformer. The full variant of the four-way ablation; the four configs differ only in
# use_map / use_neighbors (and map_point_dim, which only the map variants have).
seed: 42
device: auto  # auto | cuda | mps | cpu
data_config: data_dev.yaml

model:
  name: interaction
  use_map: true
  use_neighbors: true
  hidden_dim: 256
  num_layers: 2  # LSTM layers of the shared trajectory encoder
  dropout: 0.1  # LSTM and Transformer layers
  decoder_hidden_dim: 512
  map_point_dim: 128  # point MLP 4 -> 64 -> 128, then masked max pool and 128 -> hidden_dim
  transformer_layers: 3
  transformer_heads: 8
  transformer_ff_dim: 1024

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  smooth_l1_beta: 1.0  # metres; quadratic below, linear above
  num_workers: 4

evaluation:
  miss_threshold_m: 2.0
  stationary_speed_threshold_mps: 0.5

risk:  # conflict analysis (design doc §22); project heuristics, not safety thresholds
  distance_mode: ego_box  # ego_box | point (center-to-center, for comparison only)
  vru_radius_m: 0.4
  conflict_distance_m: 3.0  # not the design doc's 1.0, which left 7 test conflicts to score
  max_time_to_closest_approach_s: 4.0
  min_ego_speed_mps: 1.0
  max_sdc_distance_m: 50.0  # analyze only targets this close to the SDC at t0
