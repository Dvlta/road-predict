# Single-agent LSTM baseline (design doc §17). Point data_config at another tier to switch data.
seed: 42
device: auto  # auto | cuda | mps | cpu
data_config: data_dev.yaml

model:
  name: lstm
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1
  decoder_hidden_dim: 512

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  smooth_l1_beta: 1.0  # metres; quadratic below, linear above
  num_workers: 4

evaluation:
  miss_threshold_m: 2.0
  stationary_speed_threshold_mps: 0.5
