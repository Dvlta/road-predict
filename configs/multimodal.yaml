# Multimodal model (design doc §20): the full interaction model (configs/interaction.yaml)
# predicting K futures with a probability each, trained winner-takes-all. Apart from the
# epochs, everything matches the interaction config.
seed: 42
device: auto  # auto | cuda | mps | cpu
data_config: data_dev.yaml

model:
  name: multimodal
  use_map: true
  use_neighbors: true
  hidden_dim: 256
  num_layers: 2  # LSTM layers of the shared trajectory encoder
  dropout: 0.1  # LSTM and Transformer layers
  decoder_hidden_dim: 512
  map_point_dim: 128  # point MLP 4 -> 64 -> 128, then masked max pool and 128 -> hidden_dim
  transformer_layers: 3
  transformer_heads: 8
  transformer_ff_dim: 1024
  num_modes: 6

training:
  batch_size: 64
  epochs: 50  # minADE still improved after 30; the interaction ablation stays at 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  smooth_l1_beta: 1.0  # metres; quadratic below, linear above
  num_workers: 4
  lambda_cls: 1.0  # weight of the mode-classification loss
  wta_selection: ade  # ade | fde: how the winning mode is chosen
  collapse_min_win_rate: 0.02  # flag a mode that wins less often than this ...
  collapse_check_after_epochs: 3  # ... from this epoch on

evaluation:
  miss_threshold_m: 2.0
  stationary_speed_threshold_mps: 0.5
