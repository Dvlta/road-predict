[project]
name = "prs"
version = "0.1.0"
description = "Predictive Road Safety: multimodal motion forecasting for pedestrians and cyclists on WOMD"
readme = "README.md"
requires-python = ">=3.10"
# Dependencies are added at the stage that first needs them (design doc §28).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "torch>=2.5",
]

[project.optional-dependencies]
# Raw WOMD ingestion. The generated *_pb2.py files need a protobuf runtime with the same
# major version as the protoc that generated them (scripts/compile_protos.py).
ingest = ["protobuf>=7,<8"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
    "grpcio-tools>=1.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: needs downloaded WOMD shards (skipped when missing)",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/prs/data/raw/protos/*_pb2.py", "src/prs/data/raw/protos/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "_pb2\\.pyi?$"
